[pytest]
minversion = 7.0
addopts = -ra -q --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=35
testpaths =
    tests/unit
    tests/integration
markers =
    integration: mark test as requiring external services such as the database
    smoke: mark test as a minimal end-to-end pipeline smoke test using the test database